name: Test Azure Signing Authentication

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  test-auth:
    runs-on: windows-2025
    environment: vsix-signing

    steps:
      - name: Enable immutable GitHub OIDC subject
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${{ github.repository }}/actions/oidc/customization/sub" -F use_default=true -F use_immutable_subject=true

          Write-Host "Current OIDC subject configuration:"
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "/repos/${{ github.repository }}/actions/oidc/customization/sub"

      - name: Login to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure context
        shell: pwsh
        run: |
          az account show --output table

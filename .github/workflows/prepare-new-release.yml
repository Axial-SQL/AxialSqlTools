name: Prepare New Release

on:
  workflow_dispatch:

concurrency:
  group: prepare-new-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check release version
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read manifest version
        id: version
        shell: python
        run: |
          import os
          import re
          import xml.etree.ElementTree as ET
          manifest = ET.parse('AxialSqlTools/source.extension.vsixmanifest')
          version = manifest.find('.//{*}Identity').attrib['Version']
          if not re.fullmatch(r'\d+\.\d+(?:\.\d+){0,2}', version):
              raise ValueError(f'Invalid release version: {version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)

      - name: Fail if the version tag already exists
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            try {
              await github.rest.git.getRef({
                ...context.repo, ref: `tags/${process.env.RELEASE_VERSION}`
              });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            throw new Error(`Tag ${process.env.RELEASE_VERSION} already exists. Increment the version before releasing.`);

  build_and_sign:
    name: Build and Sign VSIX
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-sign-vsix.yml
    secrets: inherit

  publish:
    name: Create prerelease
    needs: [prepare, build_and_sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed VSIX
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build_and_sign.outputs.signed_artifact_id }}
          path: release-assets

      - name: Create version tag at this commit
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            await github.rest.git.createRef({
              ...context.repo,
              ref: `refs/tags/${process.env.RELEASE_VERSION}`,
              sha: context.sha
            });

      - name: Publish GitHub prerelease
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prepare.outputs.version }}
          artifacts: release-assets/*.vsix
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          immutableCreate: true
          prerelease: true
          makeLatest: false
          allowUpdates: false

name: Prepare New Release

on:
  workflow_dispatch:

concurrency:
  group: prepare-new-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate version and create release tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      already_published: ${{ steps.release.outputs.already_published }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare release
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            const release = require('./.github/scripts/release.js');
            await release.prepare({ github, context, core });

  build_and_sign:
    name: Build and Sign VSIX
    needs: prepare
    if: needs.prepare.outputs.already_published != 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-sign-vsix.yml
    with:
      build_ref: refs/tags/${{ needs.prepare.outputs.tag }}
      expected_sha: ${{ needs.prepare.outputs.source_sha }}
      expected_version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish:
    name: Publish signed release
    needs: [prepare, build_and_sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Download the signed artifact from this build
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build_and_sign.outputs.signed_artifact_id }}
          path: release-assets

      - name: Verify files and publish release
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SIGNED_SOURCE_SHA: ${{ needs.build_and_sign.outputs.source_sha }}
          SIGNED_VERSION: ${{ needs.build_and_sign.outputs.version }}
          SIGNED_VSIX_SHA256: ${{ needs.build_and_sign.outputs.vsix_sha256 }}
        with:
          script: |
            const release = require('./.github/scripts/release.js');
            await release.publish({ github, context, core, env: process.env });
